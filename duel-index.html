<style>
:root{
  --bg:#fbf3e5; --bg2:#f6e6cc; --card:#fffaf1; --card2:#fff4e2;
  --line:#ecd5b3; --line2:#e3c59b;
  --ink:#4a2f22; --ink2:#7d5f4c; --ink3:#a98c74;
  --or:#ef8a2d; --or-d:#c96a14; --or-l:#ffe2bd; --or-ll:#fff0da;
  --red:#b9493c; --red-d:#8f3329; --red-l:#f8dad3;
  --ok:#6f9a50; --ok-d:#527a37; --ok-l:#e5efd6;
  --foot:50px;
  --r:20px;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 26px -14px rgba(166,96,30,.38);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-padding-bottom:140px}
body{
  font-family:'Nunito','Manrope',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  color:var(--ink); background:var(--bg); min-height:100vh; min-height:100dvh;
  font-size:16px; line-height:1.45; font-weight:600;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(520px 360px at 108% -6%, rgba(239,138,45,.20), transparent 70%),
    radial-gradient(460px 380px at -12% 104%, rgba(222,150,80,.16), transparent 70%),
    linear-gradient(180deg,#fcf5e8,#f8ebd4);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
h1,h2,h3,p{margin:0}

#app{max-width:560px;margin:0 auto;padding:12px 14px calc(var(--foot) + 24px);min-height:100vh;min-height:100dvh}
.screen{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breakh{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}

/* ---------- кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 20px;border-radius:17px;font-weight:800;font-size:17px;letter-spacing:.2px;
  color:#fff;background:linear-gradient(180deg,#f59a42,#ee8527);
  border-bottom:4px solid var(--or-d);
  box-shadow:0 10px 18px -10px rgba(201,106,20,.6);
  transition:transform .12s, box-shadow .12s, filter .15s;
  text-decoration:none;text-align:center;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(2px);border-bottom-width:2px;box-shadow:none}
.btn[disabled]{background:#ecdcc3;color:#b8997a;border-bottom-color:#dcc6a4;box-shadow:none;pointer-events:none}
.btn.ghost{color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-bottom:4px solid var(--line2);box-shadow:none}
.btn.ghost:active{border-bottom-width:1.5px}
.btn.small{padding:10px 14px;font-size:15px;border-radius:14px;width:auto}
.btn.red{background:linear-gradient(180deg,#c85a4c,#b2432f);border-bottom-color:var(--red-d)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.sp{height:12px}.sp2{height:22px}

/* ---------- карточки ---------- */
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px;
}
.card.tint{background:linear-gradient(180deg,var(--card2),var(--card))}

/* ---------- шапка игры ---------- */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.iconbtn{
  width:42px;height:42px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);
  display:grid;place-items:center;flex:none;box-shadow:var(--shadow);transition:transform .12s;color:var(--ink2)
}
.iconbtn:active{transform:scale(.94)}
.hud .mid{flex:1;min-width:0;text-align:center}
.hud .mid b{display:block;font-size:16px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .mid small{display:block;color:var(--ink3);font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:4px;flex:none}
.heart{width:25px;height:25px;display:block}
.heart.lost path{fill:#ead7bd}
.heart.break{animation:breakh .6s ease}
.bar{height:8px;border-radius:99px;background:#efdcc0;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f6a04b,#ee8527);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.dots{display:flex;gap:6px;justify-content:center;margin:-4px 0 12px}
.dots i{width:9px;height:9px;border-radius:99px;background:#ecd8bb;transition:.3s}
.dots i.now{background:var(--or);width:22px}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:#cf7e72}

/* ---------- главная ---------- */
.home{text-align:center;padding-top:4px}
.home .logo{width:112px;height:auto;display:block;margin:4px auto 4px;animation:floaty 5s ease-in-out infinite}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--or-d)}
.title{font-size:34px;line-height:1.02;font-weight:900;letter-spacing:.01em;margin:6px 0 4px;color:var(--ink)}
.title span{color:var(--or)}
.lead{color:var(--ink2);font-size:15.5px;margin:0 auto 16px;max-width:380px}
.modes{display:flex;flex-direction:column;gap:11px;text-align:left}
.mode{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:21px;
  background:var(--card);border:1.5px solid var(--line);border-bottom:4px solid var(--line2);
  transition:transform .14s, box-shadow .14s;width:100%;text-align:left
}
.mode:hover{transform:translateY(-2px);box-shadow:0 14px 24px -16px rgba(166,96,30,.5)}
.mode:active{transform:translateY(1px);border-bottom-width:2px}
.mode .ic{
  width:58px;height:58px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(160deg,#ffe9cb,#ffd3a1);box-shadow:0 1px 0 #fff inset
}
.mode .tx{flex:1;min-width:0}
.mode .tx b{display:block;font-size:18px;font-weight:900;line-height:1.1}
.mode .tx span{display:block;font-size:13.5px;color:var(--ink2);margin-top:3px;font-weight:600;line-height:1.3}
.mode .best{margin-top:6px;display:inline-block;font-size:12px;font-weight:800;color:var(--or-d);background:var(--or-ll);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.mode .go{color:var(--ink3);flex:none}
.link{display:inline-flex;align-items:center;gap:7px;color:var(--or-d);font-weight:800;font-size:15.5px;padding:10px 6px}
.link svg{flex:none}

/* ---------- вступление к режиму ---------- */
.intro{text-align:center}
.intro .big{width:84px;height:84px;margin:6px auto 10px;border-radius:26px;display:grid;place-items:center;font-size:44px;background:linear-gradient(160deg,#ffe9cb,#ffd3a1);box-shadow:0 1px 0 #fff inset,0 14px 24px -14px rgba(201,106,20,.6)}
.intro h2{font-size:27px;font-weight:900}
.rules{margin:14px 0 6px;display:flex;flex-direction:column;gap:9px;text-align:left}
.rule{display:flex;gap:11px;align-items:flex-start;font-size:15.5px}
.rule i{flex:none;width:28px;height:28px;border-radius:10px;background:var(--or-l);display:grid;place-items:center;font-style:normal;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12.5px;font-weight:800;color:var(--or-d);background:var(--or-ll);border:1px solid var(--line);border-radius:99px;padding:3px 10px}

/* ---------- вопрос ---------- */
.qcard{padding:18px 18px 16px}
.qtag{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qtag .chip.n{background:var(--or);color:#fff;border-color:transparent}
.q{font-size:20px;line-height:1.32;font-weight:800;letter-spacing:.005em}
.q.s{font-size:17px}
.q small{display:block;font-size:14px;color:var(--ink2);font-weight:700;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  padding:13px 14px;border-radius:16px;background:#fffdf8;border:1.5px solid var(--line);border-bottom:3.5px solid var(--line2);
  font-weight:700;font-size:16.5px;line-height:1.3;transition:transform .12s,background .2s,border-color .2s;
}
.opt:hover{border-color:#e0b985}
.opt:active{transform:translateY(1px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:var(--or-ll);color:var(--or-d);display:grid;place-items:center;font-weight:900;font-size:14px;border:1px solid var(--line)}
.opt .t{flex:1;min-width:0}
.opt .own{display:block;font-size:12.5px;font-weight:700;color:var(--ink3);margin-top:3px}
.opt.year{justify-content:center;font-size:24px;font-weight:900;letter-spacing:.02em;padding:15px}
.opt.year .k{display:none}
.opts.yrs{display:grid;grid-template-columns:1fr 1fr}
.opt.correct{background:var(--ok-l);border-color:var(--ok);border-bottom-color:var(--ok-d);animation:pop .4s}
.opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--red-l);border-color:#d68a7f;border-bottom-color:var(--red);animation:shake .45s}
.opt.wrong .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.dim{opacity:.55}
.opts.locked .opt{pointer-events:none}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tf .opt{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:16px 8px;font-size:17px;font-weight:900;letter-spacing:.04em}
.tf .opt svg{width:30px;height:30px}
.typein{display:flex;gap:10px;margin-top:14px}
.typein input{
  flex:1;min-width:0;font:inherit;font-size:26px;font-weight:900;letter-spacing:.06em;text-align:center;
  padding:12px 14px;border-radius:16px;border:1.5px solid var(--line2);background:#fffdf8;color:var(--ink);outline:none;
  box-shadow:0 2px 0 rgba(255,255,255,.9) inset;
}
.typein input:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(239,138,45,.18)}
.typein input.correct{border-color:var(--ok);background:var(--ok-l)}
.typein input.wrong{border-color:var(--red);background:var(--red-l);animation:shake .45s}
.typein .btn{width:auto;flex:none;padding:12px 18px}
.hintline{font-size:13px;color:var(--ink3);margin-top:8px;text-align:center}

.person{display:flex;gap:14px;align-items:center}
.person .av{width:62px;height:62px;border-radius:20px;flex:none;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(150deg,#f7a24c,#e5761c);box-shadow:0 8px 16px -8px rgba(201,106,20,.7)}
.person b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.person span{font-size:13.5px;color:var(--ink2)}

/* ---------- обратная связь ---------- */
.fb{margin-top:14px;border-radius:18px;padding:14px 15px;animation:rise .3s both;scroll-margin-bottom:96px}
.fb.ok{background:var(--ok-l);border:1.5px solid #bcd49d}
.fb.no{background:var(--red-l);border:1.5px solid #e6b2a8}
.fb h4{margin:0 0 4px;font-size:17px;font-weight:900}
.fb.ok h4{color:var(--ok-d)} .fb.no h4{color:var(--red-d)}
.fb p{font-size:15px;line-height:1.42;color:var(--ink);font-weight:600}
.fb .src{margin-top:7px;font-size:12.5px;color:var(--ink2);font-weight:700;opacity:.85}
.fb .btn{margin-top:12px}

/* ---------- результаты ---------- */
.result{text-align:center}
.result .cat{width:150px;margin:2px auto 4px;display:block}
.result h2{font-size:27px;font-weight:900;line-height:1.1;margin:4px 0 6px}
.result p.sub{color:var(--ink2);font-size:15.5px;margin:0 auto 14px;max-width:360px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:17px;padding:12px 6px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:900;line-height:1.1}
.stat span{font-size:12px;color:var(--ink2);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.stat .hearts{justify-content:center}
.stat .heart{width:20px;height:20px}
.rankbox{position:relative;margin:6px 0 14px;padding:18px 14px;border-radius:24px;background:linear-gradient(170deg,#fff3dc,#ffe2b9);border:1.5px solid var(--line2);box-shadow:var(--shadow);overflow:hidden}
.rankbox small{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--or-d)}
.rankbox b{display:block;font-size:30px;line-height:1.05;font-weight:900;margin:5px 0 6px}
.stars{display:flex;gap:5px;justify-content:center}
.stars svg{width:26px;height:26px}
.stars .off path{fill:#ecd8bb}
.ladder{display:flex;flex-direction:column;gap:6px;text-align:left;margin:12px 0 4px}
.ladder .lr{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 10px;border-radius:12px;color:var(--ink3)}
.ladder .lr i{width:10px;height:10px;border-radius:99px;background:#e8d3b5;flex:none}
.ladder .lr.on{background:rgba(255,255,255,.7);color:var(--ink);font-weight:800}
.ladder .lr.on i{background:var(--or)}
.ladder .lr.done{color:var(--ink2)}
.ladder .lr.done i{background:#e1a566}
.review{text-align:left;margin-top:12px}
.review h3{font-size:16px;font-weight:900;margin-bottom:8px}
.review .it{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:11px 13px;margin-bottom:8px;font-size:14.5px}
.review .it .s{display:block;font-size:12px;color:var(--ink3);margin-top:4px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:3px;opacity:0;animation:fall 2.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}

/* ---------- таймлайн ---------- */
.tl{position:relative;margin:14px 0 4px;padding-left:2px}
.tl::before{content:"";position:absolute;left:21px;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(180deg,#f2c691,#e8a561)}
.tlend{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 4px 2px}
.slot{display:flex;align-items:center;gap:10px;margin:0 0 7px;position:relative}
.slot .dot{width:40px;flex:none;display:grid;place-items:center;position:relative;z-index:1}
.slot .dot b{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:13.5px;font-weight:900;background:var(--card);border:2px solid #e8b878;color:var(--or-d);transition:.3s}
.slot .box{flex:1;min-width:0;min-height:38px;border-radius:13px;border:1.8px dashed #dfc196;background:rgba(255,250,241,.6);display:flex;align-items:center;padding:6px 11px;color:var(--ink3);font-size:14px;font-weight:700;transition:.25s}
.slot.sel .box{border-color:var(--or);background:var(--or-ll);box-shadow:0 0 0 4px rgba(239,138,45,.14)}
.slot.fill .box{min-height:48px;border-style:solid;border-color:var(--line2);background:#fffdf8;color:var(--ink);font-size:14.8px;line-height:1.3;cursor:pointer;border-bottom:3.5px solid var(--line2)}
.slot.lock .box{background:var(--ok-l);border-color:var(--ok);border-bottom-color:var(--ok-d);cursor:default}
.slot.lock .dot b{background:var(--ok);border-color:var(--ok);color:#fff}
.slot.bad .box{background:var(--red-l);border-color:#d68a7f;border-bottom-color:var(--red);animation:shake .5s}
.slot .yr{flex:none;margin-left:10px;font-weight:900;font-size:15px;color:var(--ok-d);background:#fff;border:1.5px solid #bcd49d;border-radius:99px;padding:1px 9px;animation:pop .45s}
.pool{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.pool .lbl{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:8px 2px 0}
.ev{padding:10px 13px;border-radius:14px;background:#fffdf8;border:1.5px solid var(--line);border-bottom:3.5px solid var(--line2);font-size:14.8px;font-weight:700;line-height:1.3;text-align:left;width:100%;transition:transform .12s}
.ev:active{transform:translateY(1px)}
.ev.pop{animation:pop .3s}
.tlbar{position:sticky;bottom:var(--foot);margin:10px -18px -16px;padding:18px 18px 12px;z-index:5;background:linear-gradient(180deg,rgba(255,250,241,0),var(--card) 38%);border-radius:0 0 var(--r) var(--r)}

/* ---------- теория ---------- */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(74,47,34,.38);animation:fade .25s both}
#sheet .pane{
  position:absolute;left:50%;transform:translateX(-50%);bottom:0;top:28px;width:min(640px,100%);
  background:var(--bg);border-radius:26px 26px 0 0;border:1.5px solid var(--line);border-bottom:0;
  display:flex;flex-direction:column;animation:sheetin .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -20px 50px -20px rgba(74,47,34,.5)
}
@keyframes sheetin{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.pane .ph{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.pane .ph h3{flex:1;font-size:20px;font-weight:900}
.tabs{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:14.5px;color:var(--ink2);transition:.2s}
.tab.on{background:var(--or);color:#fff;border-color:var(--or)}
.pane .pb{flex:1;overflow-y:auto;padding:4px 16px calc(var(--foot) + 28px);-webkit-overflow-scrolling:touch}
.tc{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:11px;box-shadow:var(--shadow)}
.tc h4{margin:0 0 8px;font-size:17px;font-weight:900}
.tc .chips{justify-content:flex-start;margin-bottom:8px}
.tc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.tc li{position:relative;padding-left:16px;font-size:14.8px;line-height:1.42;font-weight:600}
.tc li::before{content:"";position:absolute;left:1px;top:.6em;width:7px;height:7px;border-radius:99px;background:var(--or)}

/* ---------- модалка ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
#modal .back{position:absolute;inset:0;background:rgba(74,47,34,.4);animation:fade .2s both}
#modal .box{position:relative;width:min(380px,100%);background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:22px 20px 18px;text-align:center;animation:pop .3s both;box-shadow:0 30px 60px -24px rgba(74,47,34,.6)}
#modal h3{font-size:21px;font-weight:900;margin-bottom:6px}
#modal p{color:var(--ink2);font-size:15.5px;margin-bottom:16px}

/* ---------- подвал ---------- */
#foot{
  position:fixed;left:0;right:0;bottom:0;height:var(--foot);z-index:50;
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:rgba(255,248,236,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1.5px solid var(--line);padding:0 12px;
}
#foot img{height:34px;width:auto;display:block}
#foot .nm{font-weight:900;font-size:15px;line-height:1;letter-spacing:.01em;color:var(--ink)}
#foot .nm small{display:block;font-size:11px;color:var(--ink3);font-weight:700;margin-top:2px;white-space:nowrap}
#foot a.sub{
  margin-left:4px;padding:7px 14px;border-radius:99px;background:var(--or);color:#fff;text-decoration:none;
  font-weight:800;font-size:13.5px;border-bottom:3px solid var(--or-d);white-space:nowrap
}
#foot a.sub:active{transform:translateY(1px)}

/* ---------- адаптив ---------- */
@media (max-width:380px){
  .title{font-size:29px}
  .q{font-size:18.5px}
  .opt{font-size:15.5px;padding:12px}
  .opt.year{font-size:21px}
  #foot .nm small{display:none}
  #foot .nm{font-size:13.5px;white-space:nowrap}
  #foot img{height:30px}
  #foot a.sub{padding:7px 11px;font-size:13px}
  .mode .ic{width:50px;height:50px;font-size:26px}
  .stats{gap:7px}
  .stat b{font-size:21px}
}
@media (max-height:640px){
  .home .logo{width:84px}
  .result .cat{width:110px}
}
@media (min-width:700px){
  #app{padding-top:26px}
  .title{font-size:40px}
  .qcard{padding:22px}
  .q{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- ДУЭЛЬ · дополнения к базовому стилю ---------- */
.kicker{font-size:12.5px;font-weight:900;letter-spacing:.2em;color:var(--or-d);margin-top:2px}
.title{font-size:34px;line-height:1.05;font-weight:900;margin:6px 0 8px}
.title span{color:var(--or)}
.lead{color:var(--ink2);font-size:16px;max-width:400px;margin:0 auto 16px}
.lab{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin:0 0 6px;letter-spacing:.03em}
.inp{width:100%;font:inherit;font-size:18px;font-weight:800;padding:13px 14px;border-radius:15px;border:1.5px solid var(--line2);background:#fffdf8;color:var(--ink);outline:none}
.inp:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(239,138,45,.18)}
.inp.code{font-size:24px;letter-spacing:.14em;text-align:center;font-weight:900}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--ink3);font-size:13px;font-weight:800}
.or::before,.or::after{content:"";flex:1;height:1.5px;background:var(--line)}
.joinrow{display:flex;gap:10px}
.joinrow .inp{flex:1.2;min-width:0}
.joinrow .btn{width:auto;flex:1;padding-left:14px;padding-right:14px}
.invite{text-align:center;font-size:16px;background:var(--or-ll);border:1.5px solid var(--line);border-radius:14px;padding:10px}
.invite b{font-size:20px;letter-spacing:.1em;color:var(--or-d)}
.how{margin-top:14px;display:flex;flex-direction:column;gap:11px;padding:16px}
.step{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--ink2);text-align:left}
.step i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px}
.step b{color:var(--ink)}
.note-err{background:var(--red-l);border:1.5px solid #e6b2a8;color:var(--red-d);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-weight:700;font-size:15px;animation:rise .3s both}
.note-ok{background:var(--ok-l);border:1.5px solid #bcd49d;color:var(--ok-d);border-radius:14px;padding:10px;margin:0 0 12px;font-weight:800;animation:pop .4s both}

.center{text-align:center;padding-top:26px}
.h2{font-size:25px;font-weight:900;line-height:1.15;margin:10px 0 6px}
.muted{color:var(--ink2);font-size:15.5px;max-width:380px;margin:0 auto}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid var(--or-l);border-top-color:var(--or);margin:8px auto 6px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bigemoji .cat{width:140px;margin:0 auto;display:block}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--or);animation:bounce 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

.codebox{text-align:center;margin-top:6px}
.codebox small{font-size:12.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--or-d)}
.bigcode{font-size:52px;font-weight:900;letter-spacing:.12em;line-height:1.1;margin:8px 0 14px;color:var(--ink);font-variant-numeric:tabular-nums}
.btn.tg{background:linear-gradient(180deg,#5aa9e0,#3f8fcb);border-bottom-color:#2e6f9f;box-shadow:0 10px 18px -10px rgba(46,111,159,.6)}
.waiting{text-align:center;margin-top:18px;color:var(--ink2)}
.waiting p{font-weight:800;font-size:16px}
.waiting small{color:var(--ink3);font-size:13.5px}

.vsline{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px}
.vsline>span{font-weight:900;color:var(--ink3);font-size:15px}
.vsline .pl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px}
.vsline .pl i,.vs .pl i{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:20px;color:#fff;background:linear-gradient(150deg,#f7a24c,#e5761c);box-shadow:0 8px 16px -8px rgba(201,106,20,.7)}
.vsline .pl.op i,.vs .pl.op i{background:linear-gradient(150deg,#d8806f,#b9493c);box-shadow:0 8px 16px -8px rgba(143,51,41,.6)}
.vsline .pl b{font-size:15px;font-weight:900}

/* табло */
.hud .mid{text-align:initial}
.vs{display:flex;align-items:center;justify-content:space-between;gap:6px}
.vs .pl{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.vs .pl.op{justify-content:flex-end;text-align:right}
.vs .pl i{width:38px;height:38px;border-radius:13px;font-size:14px;flex:none}
.vs .pl b{display:block;font-size:13.5px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .pl>div{min-width:0}
.vs .pts{display:block;font-size:20px;font-weight:900;color:var(--or-d);line-height:1.1;font-variant-numeric:tabular-nums}
.vs .pl.op .pts{color:var(--red)}
.vs .qn{text-align:center;flex:none;line-height:1}
.vs .qn small{display:block;font-size:10.5px;font-weight:800;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.vs .qn b{font-size:20px;font-weight:900}
.vs .qn em{font-style:normal;color:var(--ink3);font-size:14px}
.tbar{position:relative;height:12px;border-radius:99px;background:var(--or-l);margin:0 0 12px;overflow:hidden}
.tbar div{height:100%;border-radius:99px;background:linear-gradient(90deg,#f6b84a,#ef8a2d);transition:width .12s linear}
.tbar div.low{background:linear-gradient(90deg,#e0725f,#b9493c)}
.tbar span{position:absolute;right:8px;top:-1px;font-size:11px;font-weight:900;color:var(--ink);line-height:14px}
.qtag{justify-content:space-between}
.ost{font-size:12.5px;font-weight:800;color:var(--ink3)}
.ost.done{color:var(--ok-d)}
.wtxt{margin-top:12px;text-align:center;color:var(--ink2);font-weight:800;font-size:14.5px;animation:fade .3s both}
.opt.mine{background:var(--or-ll);border-color:var(--or);border-bottom-color:var(--or-d)}
.opt{position:relative}
.pks{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.opt.year .pks{position:absolute;right:6px;bottom:4px}
.tf .opt .pks{position:absolute;right:6px;bottom:4px}
.pk{font-size:11px;font-weight:900;padding:2px 7px;border-radius:99px;line-height:1.3}
.pk.me{background:var(--or);color:#fff}
.pk.op{background:var(--red);color:#fff}
.oppline{font-size:14px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.btn.wait{background:#ecdcc3;color:#a98c74;border-bottom-color:#dcc6a4;box-shadow:none;pointer-events:none}

/* финал */
.duelbox{display:flex;align-items:stretch;justify-content:center;gap:8px;margin:12px 0 14px}
.duelbox .side{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 8px;box-shadow:var(--shadow)}
.duelbox .side.w{background:linear-gradient(170deg,#fff3dc,#ffe2b9);border-color:var(--line2)}
.duelbox small{display:block;font-size:13px;font-weight:900;color:var(--ink2)}
.duelbox b{display:block;font-size:44px;font-weight:900;line-height:1.05;color:var(--or-d);font-variant-numeric:tabular-nums}
.duelbox .side.op b{color:var(--red)}
.duelbox span{font-size:12.5px;color:var(--ink2);font-weight:800}
.duelbox .sep{align-self:center;font-size:28px;font-weight:900;color:var(--ink3)}
.dotrow{display:flex;gap:4px;justify-content:center;margin-top:9px;flex-wrap:wrap}
.dotrow i{width:10px;height:10px;border-radius:50%}
.dotrow i.y{background:var(--ok)}.dotrow i.n{background:#e6b2a8}
.miss{margin-top:16px}
.miss h3{font-size:18px;font-weight:900;margin:0 0 10px}
.mi{padding:11px 0;border-top:1.5px dashed var(--line)}
.mi:first-of-type{border-top:0;padding-top:0}
.mi b{font-size:15px;line-height:1.35;display:block}
.mi .ca{font-size:14px;font-weight:800;color:var(--ok-d);margin:4px 0 2px}
.mi p{font-size:14px;color:var(--ink2);line-height:1.4;margin:0}
.mi small{display:block;color:var(--ink3);font-size:12px;font-weight:700;margin-top:3px}
.toast{position:fixed;left:50%;bottom:calc(var(--foot) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:99px;z-index:80;animation:rise .25s both;white-space:nowrap}

/* подвал: не обрезается на узких экранах */
#foot{padding:0 14px;gap:10px}
#foot img{flex:none}
#foot a.sub{flex:none;margin-left:2px}
#foot .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){ #foot .nm{font-size:14px} #foot .nm small{font-size:10px} #foot a.sub{padding:7px 12px;font-size:13.5px} .bigcode{font-size:44px} .title{font-size:31px} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.qtag{justify-content:flex-start;flex-wrap:wrap}
.qtag .ost{margin-left:auto}
.chip.era{background:#fff;color:var(--ink2)}

</style>
</head>

/* ===================================================================
   ДУЭЛЬ · построение 10 вопросов (только у хозяина комнаты)
   Банк: даты (4-вариантные), правда/ложь, матч событий — из игры «1132–1533».
   Все факты — из скриптов 3, 4, 5; источник (скрипт и слайд) показывается после ответа.
   =================================================================== */
var BLOCK_OF = {'Раздробленность':3, 'Нашествия':4, 'Москва':5};
var N_Q = 10;

function placeAt(correct, others, slot){            // вернуть {opts, ci}
  var o = shuffle(others), out = [];
  for (var i = 0, j = 0; i < o.length + 1; i++) out.push(i === slot ? correct : o[j++]);
  return {opts: out, ci: slot};
}
function stemHit(p, text){ return p.stems.some(function(s){ return text.indexOf(s) >= 0; }); }

function matchDistractors(p, cor){
  var blk = BLOCK_OF[p.tag];
  var pool = EV.filter(function(e){ return e !== cor && e.w.indexOf(p.n) < 0 && !stemHit(p, e.t); });
  var same = shuffle(pool.filter(function(e){ return e.s[0] === blk; })), other = shuffle(pool.filter(function(e){ return e.s[0] !== blk; }));
  var used = {}; used[cor.w[0]] = 1; var res = [];
  function take(list, cnt){
    for (var i = 0; i < list.length && cnt > 0; i++){
      var e = list[i]; if (used[e.w[0]] || res.indexOf(e) >= 0) continue;
      used[e.w[0]] = 1; res.push(e); cnt--;
    }
  }
  take(same, 2); take(other, 1); take(same.concat(other), 3 - res.length);
  return res;
}

/* выбрать k элементов с разными раундами (r), чтобы вопросы были разнообразные */
function spreadByRound(list, k){
  var sh = shuffle(list), out = [], seen = {};
  sh.forEach(function(x){ if (out.length < k && !seen[x.r]){ seen[x.r] = 1; out.push(x); } });
  sh.forEach(function(x){ if (out.length < k && out.indexOf(x) < 0) out.push(x); });
  return out;
}

/* ---------- банк IX–XII веков (из игры «Проверь себя — IX–XII века») ---------- */
var ERA1 = 'IX–XII вв.', ERA2 = '1132–1533';
var GENERIC = {'князь':1, 'княгиня':1, 'митрополит':1, 'летописец':1, 'хан':1, 'старый':1, 'великий':1, 'мудрый':1};
function nameStems(person){
  return person.toLowerCase().split(/[\s\-]+/).filter(function(w){ return w.length >= 4 && !GENERIC[w]; }).map(function(w){ return w.slice(0, 5); });
}
function mentions(text, stems){ var t = text.toLowerCase(); return stems.some(function(st){ return t.indexOf(st) >= 0; }); }

function ixDateQ(d){
  var yr = +d.ans, opts;
  if (d.type === 'mc' && d.opts){ opts = d.opts.slice(); }
  else {
    var near = IX_DATES.map(function(x){ return +x.ans; }).filter(function(y){ return y !== yr && Math.abs(y - yr) <= 150; });
    var uniq = shuffle(near.filter(function(y, i){ return near.indexOf(y) === i; })).slice(0, 3);
    while (uniq.length < 3){ var y2 = yr + (rnd(2) ? 1 : -1) * (3 + rnd(40)); if (y2 !== yr && uniq.indexOf(y2) < 0) uniq.push(y2); }
    opts = [String(yr)].concat(uniq.map(String));
  }
  opts = shuffle(opts);
  return {kind:'date', era:ERA1, text:d.q, opts:opts, ci:opts.indexOf(String(d.ans)), n:'', s:null, label:d.q, r:d.r};
}
function ixTfQ(t){
  return {kind:'tf', era:ERA1, text:t.text, opts:['Правда', 'Ложь'], ci:t.ans ? 0 : 1, n:t.note || '', s:null, label:t.text, r:t.r};
}
function ixMatchQ(p){
  var stems = nameStems(p.person);
  var pool = IX_PE.filter(function(x){ return x.person !== p.person && !mentions(x.event, stems); });
  var ds = shuffle(pool).slice(0, 3).map(function(x){ return x.event; });
  var pl = placeAt(p.event, ds, rnd(4));
  return {kind:'match', era:ERA1, person:{n:p.person, tag:ERA1}, text:p.person, opts:pl.opts, ci:pl.ci, n:'', s:null, label:p.person + ': ' + p.event, r:p.r};
}

/* ---------- банк 1132–1533 (скрипты 3, 4, 5) ---------- */
function dateQ(d){
  var others = shuffle(d.d.filter(function(y){ return y !== d.y; })).slice(0, 3);
  var pl = placeAt(d.y, others, rnd(4));
  return {kind:'date', era:ERA2, text:d.q, opts:pl.opts.map(String), ci:pl.ci, n:d.n, s:d.s, label:d.q, r:d.r};
}
function tfQ(t){
  return {kind:'tf', era:ERA2, text:t.q, opts:['Правда', 'Ложь'], ci:t.v ? 0 : 1, n:t.n, s:t.s, label:t.q, r:t.r};
}
function matchQ(p){
  var own = EV.filter(function(e){ return e.by === p.n; });
  var cor = pick(own), ds = matchDistractors(p, cor);
  var pl = placeAt(cor.t, ds.map(function(e){ return e.t; }), rnd(4));
  return {kind:'match', era:ERA2, person:{n:p.n, tag:ERA2}, text:p.n, opts:pl.opts, ci:pl.ci, n:'', s:cor.s, label:p.n + ': ' + cor.t, r:p.r};
}

/* k вопросов: примерно поровну из двух периодов */
function mixPick(listA, listB, k, mkA, mkB){
  var kA = (k % 2) ? (rnd(2) ? (k + 1) / 2 : (k - 1) / 2) : k / 2;
  return spreadByRound(listA, kA).map(mkA).concat(spreadByRound(listB, k - kA).map(mkB));
}

/* Полный вопрос (с ответом). Хозяин хранит его у себя, сопернику уходит версия без ответа (см. publicQ). */
function buildDuelQuestions(n){
  n = n || N_Q;
  var nDates = Math.round(n * .4), nTruth = Math.round(n * .3), nMatch = n - nDates - nTruth;
  var qs = [];

  qs = qs.concat(mixPick(IX_DATES, DATES.filter(function(d){ return d.t === 'mc'; }), nDates, ixDateQ, dateQ));

  /* правда/ложь: не все одинаковые */
  var wantTrue = (nTruth >= 2) ? (1 + rnd(nTruth - 1)) : rnd(2);
  function tfPicks(wantV, k){
    return mixPick(IX_TF.filter(function(t){ return t.ans === wantV; }), TRUTH.filter(function(t){ return t.v === wantV; }), k, ixTfQ, tfQ);
  }
  qs = qs.concat(tfPicks(true, wantTrue), tfPicks(false, nTruth - wantTrue));

  var pe = IX_PE.map(function(x, i){ x.r = Math.floor(i / 5); return x; });
  qs = qs.concat(mixPick(pe, PEOPLE, nMatch, ixMatchQ, matchQ));

  /* порядок: виды не должны идти подряд, если можно */
  var best = null;
  for (var k = 0; k < 300; k++){
    var arr = shuffle(qs), ok = true;
    for (var i = 1; i < arr.length; i++) if (arr[i].kind === arr[i-1].kind){ ok = false; break; }
    best = arr; if (ok) break;
  }
  return best;
}

/* что видит соперник: без правильного ответа и пояснения */
function publicQ(q){
  var o = {kind:q.kind, text:q.text, opts:q.opts, era:q.era};
  if (q.person) o.person = q.person;
  return o;
}
function srcLabel(s){ return s ? srcText(s) : ''; }

/* ===================================================================
   ДУЭЛЬ · сеть. Два браузера соединяются напрямую (WebRTC, библиотека PeerJS).
   Код комнаты — 6 цифр; он же «адрес» хозяина у бесплатного сервиса знакомств.
   Через сервис проходит только «знакомство»; ответы идут напрямую между игроками.
   =================================================================== */
var PREFIX = 'hac-duel1-';
var NET = {peer:null, conn:null, role:null, code:null, onMsg:null, onClose:null, onState:null, timer:null, dead:false};

function peerOptions(){
  /* для проверки: ?ps=host:port (локальный сервер знакомств); в обычной жизни — бесплатный облачный PeerJS */
  var m = /[?&]ps=([^&#]+)/.exec(location.search), o = {debug:0};
  if (m){
    var hp = decodeURIComponent(m[1]).split(':');
    o.host = hp[0]; o.port = +(hp[1] || 9000); o.path = '/'; o.secure = false;
    o.config = {iceServers: []};
  }
  return o;
}
function newCode(){ var s = ''; for (var i = 0; i < 6; i++) s += rnd(10); return s; }
function fmtCode(c){ return c.slice(0, 3) + ' ' + c.slice(3); }
function cleanCode(v){
  /* цифры; русская раскладка не мешает, т.к. код — только цифры */
  return String(v || '').replace(/[^0-9]/g, '').slice(0, 6);
}

function netReset(){
  NET.dead = true; clearTimeout(NET.timer);
  try { if (NET.conn) NET.conn.close(); } catch (e) {}
  try { if (NET.peer) NET.peer.destroy(); } catch (e) {}
  NET.peer = null; NET.conn = null; NET.role = null; NET.code = null;
}
function send(msg){
  try { if (NET.conn && NET.conn.open) NET.conn.send(msg); } catch (e) {}
}

function wireConn(conn){
  NET.conn = conn;
  conn.on('data', function(m){ if (NET.onMsg) NET.onMsg(m); });
  conn.on('close', function(){ if (!NET.dead && NET.onClose) NET.onClose(); });
  conn.on('error', function(){ if (!NET.dead && NET.onClose) NET.onClose(); });
}

/* ---------- хозяин: создать комнату ---------- */
function hostRoom(cb){        // cb(err, code) — один раз, когда комната готова
  netReset(); NET.dead = false; NET.role = 'host';
  var tries = 0, done = false;
  function attempt(){
    var code = newCode(), peer;
    try { peer = new Peer(PREFIX + code, peerOptions()); } catch (e) { return cb('lib'); }
    NET.peer = peer; NET.code = code;
    peer.on('open', function(){ if (!done){ done = true; clearTimeout(NET.timer); cb(null, code); } });
    peer.on('error', function(err){
      if (NET.dead) return;
      if (err && err.type === 'unavailable-id' && tries++ < 6){ try { peer.destroy(); } catch (e) {} return attempt(); }
      if (!done){ done = true; clearTimeout(NET.timer); cb(err && err.type || 'net'); }
      else if (NET.onClose && (!NET.conn || !NET.conn.open)) { /* потеряна связь с сервисом, но игрок ещё не подключён */ if (NET.onState) NET.onState('lost'); }
    });
    peer.on('disconnected', function(){ try { if (!NET.dead) peer.reconnect(); } catch (e) {} });
    peer.on('connection', function(conn){
      if (NET.conn && NET.conn.open){ conn.on('open', function(){ try { conn.send({t:'busy'}); } catch (e) {} setTimeout(function(){ try { conn.close(); } catch (e) {} }, 200); }); return; }
      conn.on('open', function(){ wireConn(conn); if (NET.onState) NET.onState('joined'); });
    });
  }
  clearTimeout(NET.timer);
  NET.timer = setTimeout(function(){ if (!done){ done = true; cb('timeout'); } }, 15000);
  attempt();
}

/* ---------- гость: войти по коду ---------- */
function joinRoom(code, cb){  // cb(err) — когда канал открыт или ошибка
  netReset(); NET.dead = false; NET.role = 'guest'; NET.code = code;
  var done = false, peer;
  try { peer = new Peer(peerOptions()); } catch (e) { return cb('lib'); }
  NET.peer = peer;
  function fail(e){ if (!done){ done = true; clearTimeout(NET.timer); cb(e); } }
  peer.on('error', function(err){ if (!NET.dead) fail(err && err.type || 'net'); });
  peer.on('open', function(){
    var conn = peer.connect(PREFIX + code, {reliable:true});
    conn.on('open', function(){ if (!done){ done = true; clearTimeout(NET.timer); wireConn(conn); cb(null); } });
    conn.on('error', function(){ fail('net'); });
    conn.on('close', function(){ if (!done) fail('closed'); });
  });
  NET.timer = setTimeout(function(){ fail('timeout'); }, 18000);
}

  }
  $('#join').onclick = function(){
    var code = invited || cleanCode(cd && cd.value);
    if (code.length !== 6){ toast('Код — это 6 цифр'); if (cd) cd.focus(); return; }
    joinGame(code);
  };
}
function readName(){
  var el = $('#nm'); var n = cleanName(el ? el.value : '') || pick(CAT_NAMES);
  saveName(n); ME.name = n; return n;
}

/* ====================== ЛОББИ ====================== */
function connecting(text){
  screen('<div class="center"><div class="spinner"></div><h2 class="h2">' + esc(text) + '</h2><p class="muted">Это займёт несколько секунд</p></div>');
}
function netError(err, joining){
  var m;
  if (err === 'peer-unavailable') m = 'Комната с таким кодом не найдена. Проверь цифры — возможно, друг ещё не создал игру или уже закрыл её.';
  else if (err === 'timeout') m = 'Не получилось соединиться. Проверь интернет и попробуйте ещё раз (иногда помогает переключить Wi-Fi на мобильную сеть).';
  else if (err === 'busy') m = 'В этой комнате уже играют двое.';
  else m = 'Нет связи с сервисом знакомства игроков. Проверь интернет и попробуй ещё раз.';
  home(m);
}
function createGame(){
  readName(); connecting('Создаём комнату…');
  hostRoom(function(err, code){
    if (err) return netError(err);
    NET.onState = function(s){ if (s === 'joined'){ NET.onMsg = hostOnMsg; } };
    NET.onClose = opponentLeft;
    lobby(code);
  });
}
function lobby(code){
  var link = inviteLink(code);
  screen(
    '<div class="hud"><button class="iconbtn" id="back" aria-label="Назад">' + I.back + '</button><div class="mid"><b>Дуэль</b><small>ждём соперника</small></div><span style="width:42px"></span></div>' +
    '<div class="card tint codebox">' +
      '<small>Код комнаты</small>' +
      '<div class="bigcode" id="bc">' + fmtCode(code) + '</div>' +
      '<div class="row"><button class="btn ghost small" id="cc">Копировать код</button><button class="btn ghost small" id="cl">Копировать ссылку</button></div>' +
      '<div class="sp"></div>' +
      '<a class="btn tg" id="tg" target="_blank" rel="noopener" href="https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('Сыграем в историческую дуэль? Код комнаты: ' + fmtCode(code)) + '">Отправить в Telegram</a>' +
    '</div>' +
    '<div class="waiting"><div class="dots"><i></i><i></i><i></i></div><p>Ждём, когда соперник введёт код…</p><small>Не закрывай эту страницу, пока друг не присоединится</small></div>');
  $('#back').onclick = function(){ home(); };
  $('#cc').onclick = function(){ copyText(code, 'Код скопирован'); };
  $('#cl').onclick = function(){ copyText(link, 'Ссылка скопирована'); };
}
function hostOnMsg(m){
  if (!m || !m.t) return;
  if (m.t === 'hello'){
    OPP.name = cleanName(m.name) || 'Соперник';
    if (OPP.name === ME.name) OPP.name = OPP.name + ' 2';
    send({t:'welcome', name:ME.name, opp:OPP.name});
    readyHost();
  } else if (m.t === 'ans'){ hostRecord('g', m.k, m.ms, m.i);
  } else if (m.t === 'ready'){ if (H && m.i === H.i){ H.ready.g = true; if (H.ready.h && H.revealed) advance(); }
  } else if (m.t === 'again'){ if (H){ H.again.g = true; if (H.again.h) startGame(); else if (V) { V.oppAgain = true; renderFinal(); } }
  } else if (m.t === 'bye'){ opponentLeft(); }
}
function readyHost(){
  screen(
    '<div class="center">' +
      '<div class="vsline"><div class="pl me"><i>' + esc(initials(ME.name)) + '</i><b>' + esc(ME.name) + '</b></div><span>vs</span><div class="pl op"><i>' + esc(initials(OPP.name)) + '</i><b>' + esc(OPP.name) + '</b></div></div>' +
      '<h2 class="h2">Соперник на месте!</h2>' +
      '<p class="muted">10 вопросов: даты, правда или ложь и «кто участвовал». На каждый — ' + T_SEC + ' секунд.</p>' +
      '<div class="sp2"></div><button class="btn" id="st">Начать дуэль</button><div class="sp"></div><button class="btn ghost" id="lv">Выйти</button>' +
    '</div>');
  $('#st').onclick = startGame;
  $('#lv').onclick = leaveGame;
}
function initials(n){ var w = String(n || '?').trim().split(/\s+/); return (w[0][0] + (w[1] ? w[1][0] : '')).toUpperCase(); }

/* ====================== ВХОД ПО КОДУ ====================== */
function joinGame(code){
  readName(); connecting('Подключаемся к комнате ' + fmtCode(code) + '…');
  joinRoom(code, function(err){
    if (err) return netError(err, true);
    NET.onMsg = guestOnMsg; NET.onClose = opponentLeft;
    send({t:'hello', name:ME.name});
    try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
    screen('<div class="center"><div class="spinner"></div><h2 class="h2">Подключились!</h2><p class="muted">Ждём, пока хозяин комнаты начнёт игру…</p><div class="sp2"></div><button class="btn ghost" id="lv">Выйти</button></div>');
    $('#lv').onclick = leaveGame;
  });
}
function guestOnMsg(m){
  if (!m || !m.t) return;
  if (m.t === 'welcome'){ OPP.name = cleanName(m.name) || 'Соперник'; if (m.opp) ME.name = m.opp;
    screen('<div class="center"><div class="vsline"><div class="pl me"><i>' + esc(initials(ME.name)) + '</i><b>' + esc(ME.name) + '</b></div><span>vs</span><div class="pl op"><i>' + esc(initials(OPP.name)) + '</i><b>' + esc(OPP.name) + '</b></div></div>' +
      '<h2 class="h2">Вы в комнате!</h2><p class="muted">Ждём, пока <b>' + esc(OPP.name) + '</b> начнёт игру…</p><div class="dots"><i></i><i></i><i></i></div><div class="sp2"></div><button class="btn ghost" id="lv">Выйти</button></div>');
    $('#lv').onclick = leaveGame;
  } else if (m.t === 'busy'){ netReset(); netError('busy');
  } else if (m.t === 'start'){ V = {n:m.n, i:-1, scores:{me:0, opp:0}, oppAgain:false, hist:[]};
  } else if (m.t === 'q'){ showQuestion(m.i, m.q);
  } else if (m.t === 'st'){ if (V && V.i === m.i && !V.rev){ V.oppDone = !!m[op()]; paintStatus(); }
  } else if (m.t === 'rev'){ applyReveal(m);
  } else if (m.t === 'end'){ showFinal(m);
  } else if (m.t === 'again'){ if (V){ V.oppAgain = true; renderFinal(); }
  } else if (m.t === 'bye'){ opponentLeft(); }
}
function leaveGame(){
  send({t:'bye'});
  setTimeout(function(){ netReset(); home(); }, 80);
}
function opponentLeft(){
  if (!NET.role) return;
  if (H){ clearTimeout(H.timer); clearTimeout(H.adv); }
  clearInterval(window.__tint);
  var fin = V && V.final;
  netReset();
  if (fin){ toast('Соперник вышел'); if ($('#again')){ $('#again').disabled = true; $('#again').textContent = 'Соперник вышел'; } return; }
  screen('<div class="center"><div class="bigemoji">' + cat('sad') + '</div><h2 class="h2">Соперник вышел из игры</h2><p class="muted">Связь прервалась. Можно создать новую комнату и позвать друга снова.</p><div class="sp2"></div><button class="btn" id="hm">В начало</button></div>');
  $('#hm').onclick = function(){ home(); };
}

/* ====================== ИГРА · ХОЗЯИН ====================== */
function startGame(){
  H = {qs:buildDuelQuestions(N_Q), i:-1, ans:{h:null, g:null}, scores:{h:0, g:0}, rows:[], revealed:false, ready:{h:false, g:false}, again:{h:false, g:false}, timer:0, adv:0, t0:0};
  V = {n:N_Q, i:-1, scores:{me:0, opp:0}, oppAgain:false, hist:[]};
  send({t:'start', n:N_Q});
  nextQuestion();
}
function nextQuestion(){
  clearTimeout(H.timer); clearTimeout(H.adv);
  H.i++;
  if (H.i >= H.qs.length) return finishGame();
  H.ans = {h:null, g:null}; H.revealed = false; H.ready = {h:false, g:false};
  var pq = publicQ(H.qs[H.i]);
  send({t:'q', i:H.i, q:pq});
  showQuestion(H.i, pq);
  H.timer = setTimeout(reveal, (T_SEC + 3) * 1000);
}
function hostRecord(who, k, ms, i){
  if (!H || H.revealed || (i !== undefined && i !== H.i) || H.ans[who]) return;
  k = +k; if (!(k >= 0 && k < 4)) k = -1;
  ms = Math.max(0, Math.min(T_SEC * 1000, +ms || T_SEC * 1000));
  H.ans[who] = {k:k, ms:ms};
  send({t:'st', i:H.i, h:!!H.ans.h, g:!!H.ans.g});
  if (V && V.i === H.i){ V.oppDone = !!H.ans.g; paintStatus(); }
  if (H.ans.h && H.ans.g){ clearTimeout(H.timer); H.timer = setTimeout(reveal, 650); }
}
function pointsFor(a, q){
  if (!a || a.k !== q.ci) return 0;
  return 10 + Math.max(0, Math.round(5 * (1 - a.ms / (T_SEC * 1000))));
}
function reveal(){
  if (!H || H.revealed) return;
  H.revealed = true; clearTimeout(H.timer);
  var q = H.qs[H.i], a = H.ans, p = {h:pointsFor(a.h, q), g:pointsFor(a.g, q)};
  H.scores.h += p.h; H.scores.g += p.g;
  H.rows.push({label:q.label, correct:q.opts[q.ci], ans:(q.kind === 'match' ? '' : q.opts[q.ci]), n:q.n, src:srcLabel(q.s), pk:{h:a.h ? a.h.k : -1, g:a.g ? a.g.k : -1}, pts:p, ci:q.ci});
  var msg = {t:'rev', i:H.i, ci:q.ci, note:q.n, src:srcLabel(q.s), pick:{h:a.h ? a.h.k : -1, g:a.g ? a.g.k : -1}, pts:p, scores:{h:H.scores.h, g:H.scores.g}};
  send(msg); applyReveal(msg);
  H.adv = setTimeout(advance, 22000);
}
function advance(){ if (H && H.revealed) nextQuestion(); }
function finishGame(){
  var msg = {t:'end', scores:{h:H.scores.h, g:H.scores.g}, rows:H.rows, names:{h:ME.name, g:OPP.name}};
  send(msg); showFinal(msg);
}

/* ====================== ИГРА · ЭКРАН ВОПРОСА ====================== */
function showQuestion(i, q){
  V.i = i; V.q = q; V.picked = null; V.locked = false; V.rev = null; V.ready = false; V.oppDone = false; V.t0 = Date.now(); V.final = false;
  renderGame();
}
function tick(){
  if (!V || V.rev) return clearInterval(window.__tint);
  var left = T_SEC - (Date.now() - V.t0) / 1000;
  var bar = $('#tb'), num = $('#tn');
  if (bar) bar.style.width = Math.max(0, left / T_SEC * 100) + '%';
  if (bar) bar.classList.toggle('low', left < 6);
  if (num) num.textContent = Math.max(0, Math.ceil(left));
  if (left <= 0 && !V.locked) pickAnswer(-1);
}
function pickAnswer(k){
  if (!V || V.locked || V.rev) return;
  V.locked = true; V.picked = k;
  var ms = Math.min(T_SEC * 1000, Date.now() - V.t0);
  if (NET.role === 'host') hostRecord('h', k, ms, V.i); else send({t:'ans', i:V.i, k:k, ms:ms});
  renderGame();
}
function paintStatus(){
  var el = $('#ost'); if (!el || !V) return;
  el.className = 'ost' + (V.oppDone ? ' done' : '');
  el.textContent = V.rev ? '' : (V.oppDone ? 'ответил' : 'думает…');
}
function scoreboard(){
  var s = V.scores;
  return '<div class="vs">' +
    '<div class="pl me"><i>' + esc(initials(ME.name)) + '</i><div><b>' + esc(short(ME.name, 10)) + '</b><span class="pts" id="s1">' + s.me + '</span></div></div>' +
    '<div class="qn"><small>вопрос</small><b>' + (V.i + 1) + '<em>/' + V.n + '</em></b></div>' +
    '<div class="pl op"><div><b>' + esc(short(OPP.name, 10)) + '</b><span class="pts" id="s2">' + s.opp + '</span></div><i>' + esc(initials(OPP.name)) + '</i></div>' +
  '</div>';
}
function renderGame(){
  var q = V.q, r = V.rev, picked = V.picked, h = '';
  var lockedCls = (V.locked || r) ? ' locked' : '';
  function cls(k){
    var c = '';
    if (r){
      if (k === r.ci) c = ' correct'; else if (k === picked) c = ' wrong'; else c = ' dim';
    } else if (V.locked){ c = (k === picked) ? ' mine' : ' dim'; }
    return c;
  }
  function pk(k){
    if (!r) return '';
    var t = '';
    if (r.pick[my()] === k) t += '<span class="pk me">ты</span>';
    if (r.pick[op()] === k) t += '<span class="pk op">' + esc(short(OPP.name, 8)) + '</span>';
    return t ? '<span class="pks">' + t + '</span>' : '';
  }
  var body = '';
  if (q.kind === 'date'){
    body = '<div class="q">' + esc(q.text) + '<small>В каком году это произошло?</small></div><div class="opts yrs' + lockedCls + '">' +
      q.opts.map(function(o, k){ return '<button class="opt year' + cls(k) + '" data-k="' + k + '"><span class="t">' + esc(o) + '</span>' + pk(k) + '</button>'; }).join('') + '</div>';
  } else if (q.kind === 'tf'){
    body = '<div class="q s">' + esc(q.text) + '</div><div class="tf' + lockedCls + '">' +
      q.opts.map(function(o, k){ return '<button class="opt' + cls(k) + '" data-k="' + k + '">' + (k === 0 ? I.yes : I.no) + '<span>' + esc(o.toUpperCase()) + '</span>' + pk(k) + '</button>'; }).join('') + '</div>';
  } else {
    body = '<div class="person"><div class="av">' + esc(initials(q.person.n)) + '</div><div><b>' + esc(q.person.n) + '</b><span>В каком событии участвовал(а)?</span></div></div>' +
      '<div class="opts' + lockedCls + '">' +
      q.opts.map(function(o, k){ return '<button class="opt' + cls(k) + '" data-k="' + k + '"><span class="k">' + LETTERS[k] + '</span><span class="t">' + esc(o) + '</span>' + pk(k) + '</button>'; }).join('') + '</div>';
  }
  var fb = '';
  if (r){
    var me = r.pts[my()], oo = r.pts[op()], got = r.pick[my()] === r.ci, none = r.pick[my()] < 0;
    var last = V.i + 1 >= V.n;
    fb = '<div class="fb ' + (got ? 'ok' : 'no') + '"><h4>' + (got ? 'Верно! +' + me : (none ? 'Время вышло' : 'Не угадали')) + '</h4>' +
      '<div class="oppline">' + esc(OPP.name) + ': ' + (oo ? '+' + oo + ' — ответил(а) верно' : (r.pick[op()] < 0 ? 'не успел(а) ответить' : 'ошибся(ась)')) + '</div>' +
      (r.note ? '<p>' + esc(r.note) + '</p>' : '') + (r.src ? '<div class="src">' + esc(r.src) + '</div>' : '') +
      (V.ready ? '<div class="btn wait" style="margin-top:12px">Ждём соперника…</div>' : '<button class="btn" id="nx">' + (last ? 'К результатам' : 'Дальше') + I.go + '</button>') + '</div>';
  }
  var status = r ? '' : (V.locked ? '<div class="wtxt">Ответ принят · ' + (V.oppDone ? 'соперник тоже ответил…' : 'ждём соперника…') + '</div>' : '');
  screen(
    '<div class="hud"><button class="iconbtn" id="ex" aria-label="Выйти">' + I.close + '</button>' + '<div class="mid">' + scoreboard() + '</div></div>' +
    (r ? '' : '<div class="tbar"><div id="tb" style="width:' + Math.max(0, 100 - (Date.now() - V.t0) / (T_SEC * 10)) + '%"></div><span id="tn">' + T_SEC + '</span></div>') +
    '<div class="card qcard">' +
      '<div class="qtag"><span class="chip n">' + (q.kind === 'date' ? 'Дата' : q.kind === 'tf' ? 'Правда или ложь' : 'Матч событий') + '</span><span class="chip era">' + esc(q.era || '') + '</span>' +
      (r ? '' : '<span class="ost' + (V.oppDone ? ' done' : '') + '" id="ost">' + (V.oppDone ? 'ответил' : 'думает…') + '</span>') + '</div>' +
      body + status +
    '</div>' + fb, 'game');
  $$('.opt').forEach(function(b){ b.onclick = function(){ pickAnswer(+b.getAttribute('data-k')); }; });
  $('#ex').onclick = function(){ confirmBox('Выйти из игры?', 'Дуэль прервётся у обоих игроков.', 'Выйти', leaveGame); };
  var nx = $('#nx');
  if (nx) nx.onclick = function(){
    V.ready = true;
    if (NET.role === 'host'){ H.ready.h = true; if (H.ready.g) advance(); else renderGame(); }
    else { send({t:'ready', i:V.i}); renderGame(); }
  };
  if (!r) window.__tint = setInterval(tick, 100);
  if (r){ var f = $('.fb'); if (f && f.scrollIntoView) setTimeout(function(){ try { f.scrollIntoView({behavior:'smooth', block:'nearest'}); } catch (e) {} }, 60); }
}
function applyReveal(m){
  clearInterval(window.__tint);
  V.rev = m; V.ready = false; V.locked = true;
  V.scores = {me:m.scores[my()], opp:m.scores[op()]};
  V.hist.push({me:m.pts[my()], opp:m.pts[op()]});
  renderGame();
  if (m.pick[my()] === m.ci) confetti(14);
}

/* ====================== ФИНАЛ ====================== */
function showFinal(m){
  clearInterval(window.__tint);
  V = V || {n:N_Q, hist:[]};
  V.final = true; V.end = m; V.oppAgain = V.oppAgain || false; V.again = false;
  if (H){ H.again = {h:false, g:false}; }
  renderFinal();
  var a = m.scores[my()], b = m.scores[op()];
  if (a >= b) confetti(a > b ? 46 : 22);
}
function renderFinal(){
  var m = V.end, mm = my(), oo = op();
  var a = m.scores[mm], b = m.scores[oo];
  var win = a > b, draw = a === b;
  var rows = m.rows, okMe = rows.filter(function(r){ return r.pk[mm] === r.ci; }).length, okOp = rows.filter(function(r){ return r.pk[oo] === r.ci; }).length;
  function dots(who){ return '<div class="dotrow">' + rows.map(function(r){ return '<i class="' + (r.pk[who] === r.ci ? 'y' : 'n') + '"></i>'; }).join('') + '</div>'; }
  var miss = rows.filter(function(r){ return r.pk[mm] !== r.ci; });
  var title = win ? 'Победа!' : (draw ? 'Ничья!' : 'Соперник оказался сильнее');
  var sub = win ? 'Отличная дуэль — ' + esc(OPP.name) + ' остался позади.' : (draw ? 'Силы равны — самое время для реванша.' : 'Не беда: ' + esc(OPP.name) + ' сегодня был(а) сильнее. Реванш?');
  var againTxt = V.again ? 'Ждём согласия соперника…' : 'Реванш';
  screen(
    '<div class="result">' +
      cat(win || draw ? 'happy' : 'sad') +
      '<h2>' + title + '</h2><p class="sub">' + sub + '</p>' +
      '<div class="duelbox">' +
        '<div class="side me' + (win ? ' w' : '') + '"><small>' + esc(short(ME.name, 12)) + '</small><b>' + a + '</b><span>' + okMe + ' из ' + rows.length + ' верно</span>' + dots(mm) + '</div>' +
        '<div class="sep">:</div>' +
        '<div class="side op' + (!win && !draw ? ' w' : '') + '"><small>' + esc(short(OPP.name, 12)) + '</small><b>' + b + '</b><span>' + okOp + ' из ' + rows.length + ' верно</span>' + dots(oo) + '</div>' +
      '</div>' +
      (V.oppAgain ? '<div class="note-ok">' + esc(OPP.name) + ' хочет реванш!</div>' : '') +
      '<div class="stack"><button class="btn" id="again"' + (V.again ? ' disabled' : '') + '>' + againTxt + '</button><button class="btn ghost" id="hm">В начало</button></div>' +
    '</div>' +
    (miss.length ? '<div class="card miss"><h3>Над чем стоит поработать</h3>' + miss.map(function(r){
      return '<div class="mi"><b>' + esc(r.label) + '</b>' + (r.ans ? '<div class="ca">Верно: ' + esc(r.ans) + '</div>' : '') + (r.n ? '<p>' + esc(r.n) + '</p>' : '') + (r.src ? '<small>' + esc(r.src) + '</small>' : '') + '</div>';
    }).join('') + '</div>' : '<div class="card miss"><h3>Ни одной ошибки!</h3><p class="muted" style="margin:0">Вы ответили верно на все вопросы. Так держать!</p></div>'), 'final');
  $('#hm').onclick = leaveGame;
  $('#again').onclick = function(){
    if (V.again) return; V.again = true;
    if (NET.role === 'host'){ H.again.h = true; send({t:'again'}); if (H.again.g) return startGame(); }
    else send({t:'again'});
    renderFinal();
  };
}

/* ====================== СТАРТ ====================== */
window.addEventListener('DOMContentLoaded', function(){
  app = $('#app');
  if (typeof Peer === 'undefined'){
    screen('<div class="center"><h2 class="h2">Не загрузилась библиотека связи</h2><p class="muted">Обновите страницу.</p></div>'); return;
  }
  home();
  window.addEventListener('hashchange', function(){ if (!NET.role && !V) home(); });
  window.addEventListener('beforeunload', function(){ try { send({t:'bye'}); } catch (e) {} });
});

</script>
</body>
</html>
